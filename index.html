<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ನಮ್ಮ ಶಾಪುರ್ - ಮಾಸ್ಟರ್ ಅಡ್ಮಿನ್ ಪ್ಯಾನಲ್ | Master Panel</title>
  <link rel="icon" type="image/png" sizes="192x192" href="AR_Taxi_Booking_Go_Fast_512x512.png">

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, deleteDoc, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAm3HFKu101wex1b025-zJZ2BJ_o1Xvw",
      authDomain: "ar-taxi-booking-shahapur.firebaseapp.com",
      projectId: "ar-taxi-booking-shahapur",
      storageBucket: "ar-taxi-booking-shahapur.appspot.com",
      messagingSenderId: "585815710897",
      appId: "1:586815710897:web:ab7138b9c016843db95dsa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.onSnapshot = onSnapshot;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.getDocs = getDocs;
  </script>

  <style>
    :root { --primary: #d32f2f; --secondary: #1976d2; --bg: #f4f6f8; --dark: #212121; --success: #388e3c; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--dark); padding: 10px; padding-bottom: 40px; }

    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    header { background: var(--primary); color: white; padding: 12px; text-align: center; border-radius: 8px; margin-bottom: 12px; }

    /* Login Overlay */
    #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-box { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 350px; text-align: center; }
    .auth-box input { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; text-align: center; }

    /* Nav Buttons */
    .master-nav { display: flex; gap: 6px; margin-bottom: 15px; }
    .m-btn { flex: 1; padding: 10px 4px; border: none; background: #e0e0e0; border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; text-align: center; }
    .m-btn.active { background: var(--secondary); color: white; }

    /* Search Input */
    .search-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }

    .card-box { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 0.82rem; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; font-size: 0.75rem; }
    .btn-danger { background: #e53935; }
    .btn-success { background: var(--success); }

    /* Modal for Image Preview */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 10000; padding: 15px; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; max-width: 400px; width: 100%; text-align: center; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

  <!-- Secure Password Overlay -->
  <div id="authOverlay">
    <div class="auth-box">
      <h3>🔐 ಮಾಸ್ಟರ್ ಲಾಗಿನ್ ಕೋಡ್</h3>
      <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">ಮುಂದುವರಿಯಲು ರಹಸ್ಯ ಕೋಡ್ ನಮೂದಿಸಿ</p>
      <input type="password" id="masterCodeInput" placeholder="ಪಾಸ್‌ವರ್ಡ್ ಹಾಕಿ">
      <button class="btn btn-success" style="width:100%; padding:10px; font-size:0.9rem;" onclick="verifyMasterCode()">ಲಾಗಿನ್ ಮಾಡಿ</button>
    </div>
  </div>

  <!-- Image Viewer Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <h3>ಫೋಟೋ ವೀಕ್ಷಣೆ</h3>
      <img id="modalImgSrc" src="" style="width:100%; max-height:250px; object-fit:contain; margin:10px 0; border-radius:6px;">
      <div style="display:flex; gap:10px; margin-top:10px;">
        <a id="downloadLink" href="" download="document.jpg" class="btn btn-success" style="flex:1; text-decoration:none; text-align:center; padding:8px;">ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ</a>
        <button class="btn btn-danger" style="flex:1;" onclick="closeImageModal()">ಮುಚ್ಚಿ</button>
      </div>
    </div>
  </div>

  <div class="container">
    <header>
      <h2>👑 ಮಾಸ್ಟರ್ ಅಡ್ಮಿನ್ ಪ್ಯಾನಲ್</h2>
    </header>

    <!-- Navigation Tabs -->
    <div class="master-nav">
      <button class="m-btn active" onclick="switchTab('shopsTab', this)">ಅಂಗಡಿ ಮಾಲೀಕರು</button>
      <button class="m-btn" onclick="switchTab('deliveryTab', this)">ಡೆಲಿವರಿ ಬಾಯ್ಸ್</button>
      <button class="m-btn" onclick="switchTab('customersTab', this)">ಗ್ರಾಹಕರು</button>
    </div>

    <!-- SEARCH BAR -->
    <input type="text" id="masterSearch" class="search-input" placeholder="🔍 ಹೆಸರು ಅಥವಾ ಐಡಿ ಬಳಸಿ ಹುಡುಕಿ..." oninput="filterMasterData()">

    <!-- TAB 1: SHOP OWNERS -->
    <div id="shopsTab">
      <h3 style="font-size:0.9rem; margin-bottom:8px; color:var(--secondary);">🏪 ಲಾಗಿನ್ ಆಗಿರುವ ಅಂಗಡಿ ಮಾಲೀಕರು</h3>
      <div id="shopsListContainer"></div>
    </div>

    <!-- TAB 2: DELIVERY BOYS -->
    <div id="deliveryTab" style="display:none;">
      <h3 style="font-size:0.9rem; margin-bottom:8px; color:var(--secondary);">🛵 ಡೆಲಿವರಿ ಬಾಯ್ಸ್ ಪಟ್ಟಿ</h3>
      <div id="deliveryListContainer"></div>
    </div>

    <!-- TAB 3: CUSTOMERS -->
    <div id="customersTab" style="display:none;">
      <h3 style="font-size:0.9rem; margin-bottom:8px; color:var(--secondary);">🛍️ ಗ್ರಾಹಕರ ಪಟ್ಟಿ</h3>
      <div id="customersListContainer"></div>
    </div>
  </div>

  <script>
    let allShops = [];
    let allDeliveryBoys = [];
    let allCustomers = [];
    let allOrders = [];

    function verifyMasterCode() {
      const code = document.getElementById('masterCodeInput').value.trim();
      if (code === "9353444070") {
        document.getElementById('authOverlay').style.display = 'none';
        loadMasterData();
      } else {
        alert("ತಪ್ಪು ಕೋಡ್! ದಯವಿಟ್ಟು ಸರಿಯಾದ ಕೋಡ್ ನಮೂದಿಸಿ.");
      }
    }

    function switchTab(tabId, btn) {
      document.getElementById('shopsTab').style.display = tabId === 'shopsTab' ? 'block' : 'none';
      document.getElementById('deliveryTab').style.display = tabId === 'deliveryTab' ? 'block' : 'none';
      document.getElementById('customersTab').style.display = tabId === 'customersTab' ? 'block' : 'none';

      document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function loadMasterData() {
      // Fetch Orders
      window.onSnapshot(window.collection(window.db, "orders"), (snap) => {
        allOrders = [];
        snap.forEach(d => allOrders.push({ id: d.id, ...d.data() }));
        processDataViews();
      });

      // Fetch Shop Owners
      window.onSnapshot(window.collection(window.db, "shop_owners"), (snap) => {
        allShops = [];
        snap.forEach(d => allShops.push({ docId: d.id, ...d.data() }));
        renderShops(allShops);
      });

      // Fetch Delivery Boys
      window.onSnapshot(window.collection(window.db, "delivery_boys"), (snap) => {
        allDeliveryBoys = [];
        snap.forEach(d => allDeliveryBoys.push({ docId: d.id, ...d.data() }));
        renderDeliveryBoys(allDeliveryBoys);
      });

      // Fetch Customers (from Orders unique customers)
      processCustomers();
    }

    function processCustomers() {
      window.onSnapshot(window.collection(window.db, "orders"), (snap) => {
        let custMap = {};
        snap.forEach(d => {
          let o = d.data();
          if (o.customer && o.customer.phone) {
            let phone = o.customer.phone;
            if (!custMap[phone]) {
              custMap[phone] = { name: o.customer.name, phone: phone, village: o.customer.village, ordersCount: 0, returnsCount: 0 };
            }
            custMap[phone].ordersCount++;
            if (o.status === 'RETURNED') custMap[phone].returnsCount++;
          }
        });
        allCustomers = Object.values(custMap);
        renderCustomers(allCustomers);
      });
    }

    function processDataViews() {
      renderShops(allShops);
      renderDeliveryBoys(allDeliveryBoys);
    }

    function renderShops(list) {
      const container = document.getElementById('shopsListContainer');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#777; text-align:center; padding:10px;">ಯಾವುದೇ ಅಂಗಡಿ ಮಾಲೀಕರಿಲ್ಲ.</p>';
        return;
      }

      container.innerHTML = list.map(s => {
        let shopOrders = allOrders.filter(o => o.shopId === s.id);
        let totalOrders = shopOrders.length;
        let returns = shopOrders.filter(o => o.status === 'RETURNED').length;
        let earnings = shopOrders.reduce((acc, curr) => curr.status === 'DELIVERED' ? acc + Number(curr.totalPrice || 0) : acc, 0);

        return `
          <div class="card-box">
            <div style="display:flex; gap:10px; align-items:center; margin-bottom:6px;">
              <img src="${s.photo || 'https://via.placeholder.com/60'}" style="width:50px; height:50px; object-fit:cover; border-radius:50%; border:1px solid #ccc;">
              <div>
                <b>${s.shopName}</b> (${s.shopType || 'General'})<br>
                ಮಾಲೀಕರು: ${s.name} | ಫೋನ್: ${s.phone}<br>
                <b>ID: ${s.id}</b> | ಸ್ಥಳ: ${s.taluk}, ${s.district}
              </div>
            </div>
            <div style="background:#e8f4fd; padding:6px; border-radius:4px; margin:6px 0;">
              📊 <b>ತಿಂಗಳ ವರದಿ:</b> ಆರ್ಡರ್ಸ್: ${totalOrders} | ರಿಟರ್ನ್: ${returns} | ಒಟ್ಟು ಸಂಪಾದನೆ: ₹${earnings}
            </div>
            <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:center;">
              <select onchange="updateMembership('${s.docId}', this.value)" style="padding:4px; font-size:0.75rem;">
                <option value="">-- ಮೆಂಬರ್‌ಶಿಪ್ ಆಯ್ಕೆಮಾಡಿ --</option>
                <option value="3 Months">3 ತಿಂಗಳು</option>
                <option value="6 Months">6 ತಿಂಗಳು</option>
                <option value="9 Months">9 ತಿಂಗಳು</option>
                <option value="1 Year">1 ವರ್ಷ</option>
              </select>
              <span style="font-size:0.7rem; font-weight:bold; color:var(--success);">${s.membership || 'ಪೇಮೆಂಟ್ ಪೆಂಡಿಂಗ್'}</span>
              <button class="btn btn-danger" onclick="deleteRecord('shop_owners', '${s.docId}', 'ಅಂಗಡಿ ಮಾಲೀಕ')">ಡಿಲೀಟ್</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderDeliveryBoys(list) {
      const container = document.getElementById('deliveryListContainer');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#777; text-align:center; padding:10px;">ಯಾವುದೇ ಡೆಲಿವರಿ ಬಾಯ್ಸ್ ಇಲ್ಲ.</p>';
        return;
      }

      container.innerHTML = list.map(db => {
        let dbOrders = allOrders; // All system orders for commission check
        let deliveredCount = dbOrders.filter(o => o.status === 'DELIVERED' || o.status === 'STEP_4').length;
        let returnedCount = dbOrders.filter(o => o.status === 'RETURNED').length;
        let totalRevenue = dbOrders.reduce((acc, curr) => curr.status === 'DELIVERED' ? acc + Number(curr.totalPrice || 0) : acc, 0);
        let commission5 = Math.round(totalRevenue * 0.05);

        return `
          <div class="card-box">
            <div style="display:flex; gap:10px; align-items:center; margin-bottom:6px;">
              <img src="${db.selfie || 'https://via.placeholder.com/60'}" style="width:50px; height:50px; object-fit:cover; border-radius:50%; border:1px solid #ccc; cursor:pointer;" onclick="openImageModal('${db.selfie}')" title="ದೊಡ್ಡದಾಗಿ ನೋಡಿ">
              <div>
                <b>${db.name}</b> (ತಂದೆ: ${db.fatherName})<br>
                ಫೋನ್: ${db.phone} | <b>ID: ${db.id}</b><br>
                ಊರು: ${db.village}, ${db.taluk}
              </div>
            </div>
            <div style="display:flex; gap:6px; margin:6px 0;">
              <button class="btn" style="background:#1976d2; font-size:0.65rem;" onclick="openImageModal('${db.aadhaarFront}')">ಆಧಾರ್ ಫ್ರಂಟ್</button>
              <button class="btn" style="background:#1976d2; font-size:0.65rem;" onclick="openImageModal('${db.aadhaarBack}')">ಆಧಾರ್ ಬ್ಯಾಕ್</button>
              <button class="btn" style="background:#1976d2; font-size:0.65rem;" onclick="openImageModal('${db.selfie}')">ಸೆಲ್ಫಿ ಫೋಟೋ</button>
            </div>
            <div style="background:#f1f8e9; padding:6px; border-radius:4px; font-size:0.75rem;">
              📦 <b>ತಿಂಗಳ ವಿಶ್ಲೇಷಣೆ:</b> ಡೆಲಿವರಿ: ${deliveredCount} | ರಿಟರ್ನ್: ${returnedCount} | 5% ಕಮಿಷನ್: <b>₹${commission5}</b>
            </div>
            <div style="text-align:right; margin-top:6px;">
              <button class="btn btn-danger" onclick="deleteRecord('delivery_boys', '${db.docId}', 'ಡೆಲಿವರಿ ಬಾಯ್')">ಡಿಲೀಟ್ ಮಾಡಿ</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCustomers(list) {
      const container = document.getElementById('customersListContainer');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#777; text-align:center; padding:10px;">ಯಾವುದೇ ಗ್ರಾಹಕರಿಲ್ಲ.</p>';
        return;
      }

      container.innerHTML = list.map(c => `
        <div class="card-box">
          <b>ಗ್ರಾಹಕರು:</b> ${c.name} (${c.phone})<br>
          ಊರು: ${c.village}<br>
          <b>ಖರೀದಿ ಮಾಡಿರುವ ಆರ್ಡರ್ಸ್:</b> ${c.ordersCount} | <b>ರಿಟರ್ನ್ ಕಳಿಸಿರುವುದು:</b> ${c.returnsCount}
        </div>
      `).join('');
    }

    async function updateMembership(docId, plan) {
      if (!plan) return;
      try {
        await window.updateDoc(window.doc(window.db, "shop_owners", docId), { membership: `ಪೇಮೆಂಟ್ ಸಕ್ಸೆಸ್‌ಫುಲ್ (${plan})` });
        alert("ಮೆಂಬರ್‌ಶಿಪ್ ಯಶಸ್ವಿಯಾಗಿ ಅಪ್‌ಡೇಟ್ ಆಗಿದೆ!");
      } catch(e) {
        alert("Error: " + e.message);
      }
    }

    async function deleteRecord(collectionName, docId, roleName) {
      if (confirm(`⚠️ ಎಚ್ಚರಿಕೆ: ಈ ${roleName} ಅನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಡಿಲೀಟ್ ಮಾಡಲು ಬಯಸುವಿರಾ?\n\nOK ಒತ್ತಿದರೆ ಇವರ ಐಡಿ ಮತ್ತು ಲಾಗಿನ್ ರದ್ದಾಗುತ್ತದೆ.`)) {
        try {
          await window.deleteDoc(window.doc(window.db, collectionName, docId));
          alert(`${roleName} ಯಶಸ್ವಿಯಾಗಿ ಡಿಲೀಟ್ ಮಾಡಲಾಗಿದೆ.`);
        } catch(e) {
          alert("Error: " + e.message);
        }
      }
    }

    function openImageModal(imgSrc) {
      document.getElementById('modalImgSrc').src = imgSrc;
      document.getElementById('downloadLink').href = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function filterMasterData() {
      const q = document.getElementById('masterSearch').value.toLowerCase();
      renderShops(allShops.filter(s => s.name.toLowerCase().includes(q) || s.id.includes(q) || s.shopName.toLowerCase().includes(q)));
      renderDeliveryBoys(allDeliveryBoys.filter(db => db.name.toLowerCase().includes(q) || db.id.includes(q)));
      renderCustomers(allCustomers.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q)));
    }
  </script>
</body>
</html>
