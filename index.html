<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ನಮ್ಮ ಶಾಪುರ್ - ಮಾಸ್ಟರ್ ಅಡ್ಮಿನ್ ಪ್ಯಾನಲ್ | Master Panel</title>
  <link rel="icon" type="image/png" sizes="192x192" href="AR_Taxi_Booking_Go_Fast_512x512.png">

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, deleteDoc, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAm3HFKu101wex1b025-zJZ2BJ_o1Xvw",
      authDomain: "ar-taxi-booking-shahapur.firebaseapp.com",
      projectId: "ar-taxi-booking-shahapur",
      storageBucket: "ar-taxi-booking-shahapur.appspot.com",
      messagingSenderId: "585815710897",
      appId: "1:586815710897:web:ab7138b9c016843db95dsa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.onSnapshot = onSnapshot;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.getDocs = getDocs;
  </script>

  <style>
    :root { --primary: #d32f2f; --secondary: #1976d2; --bg: #f4f6f8; --dark: #212121; --success: #388e3c; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--dark); padding: 10px; padding-bottom: 40px; }

    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    header { background: var(--primary); color: white; padding: 12px; text-align: center; border-radius: 8px; margin-bottom: 12px; }

    /* Login Overlay */
    #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-box { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 350px; text-align: center; }
    .auth-box input { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; text-align: center; }

    /* Nav Buttons */
    .master-nav { display: flex; gap: 4px; margin-bottom: 15px; flex-wrap: wrap; }
    .m-btn { flex: 1; min-width: 22%; padding: 8px 2px; border: none; background: #e0e0e0; border-radius: 6px; font-weight: bold; font-size: 0.7rem; cursor: pointer; text-align: center; }
    .m-btn.active { background: var(--secondary); color: white; }

    /* Search Input */
    .search-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }

    .card-box { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 0.82rem; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; font-size: 0.75rem; text-decoration: none; display: inline-block; text-align: center; }
    .btn-danger { background: #e53935; }
    .btn-success { background: var(--success); }
    .btn-primary { background: var(--secondary); }

    /* Modal for Image / QR Preview */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 10000; padding: 15px; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; max-width: 400px; width: 100%; text-align: center; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

  <!-- Secure Password Overlay -->
  <div id="authOverlay">
    <div class="auth-box">
      <h3>🔐 ಮಾಸ್ಟರ್ ಲಾಗಿನ್ ಕೋಡ್</h3>
      <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">ಮುಂದುವರಿಯಲು ರಹಸ್ಯ ಕೋಡ್ ನಮೂದಿಸಿ</p>
      <input type="password" id="masterCodeInput" placeholder="ಪಾಸ್‌ವರ್ಡ್ ಹಾಕಿ">
      <button class="btn btn-success" style="width:100%; padding:10px; font-size:0.9rem;" onclick="verifyMasterCode()">ಲಾಗಿನ್ ಮಾಡಿ</button>
    </div>
  </div>

  <!-- Image & QR Viewer Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">ಫೋಟೋ / ಕ್ಯೂಆರ್ ವೀಕ್ಷಣೆ</h3>
      <div id="modalBodyContent">
        <img id="modalImgSrc" src="" style="width:100%; max-height:250px; object-fit:contain; margin:10px 0; border-radius:6px;">
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <a id="downloadLink" href="" download="document.jpg" class="btn btn-success" style="flex:1; text-decoration:none; text-align:center; padding:8px;">ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ</a>
        <button class="btn btn-danger" style="flex:1;" onclick="closeImageModal()">ಮುಚ್ಚಿ</button>
      </div>
    </div>
  </div>

  <div class="container">
    <header>
      <h2>👑 ಮಾಸ್ಟರ್ ಅಡ್ಮಿನ್ ಪ್ಯಾನಲ್</h2>
    </header>

    <!-- Navigation Tabs -->
    <div class="master-nav">
      <button class="m-btn active" onclick="switchTab('shopsTab', this)">ಅಂಗಡಿ ಮಾಲೀಕರು</button>
      <button class="m-btn" onclick="switchTab('deliveryTab', this)">ಡೆಲಿವರಿ ಬಾಯ್ಸ್</button>
      <button class="m-btn" onclick="switchTab('customersTab', this)">ಗ್ರಾಹಕರು</button>
      <button class="m-btn" onclick="switchTab('returnsTab', this)">ರಿಟರ್ನ್/ಅರ್ಜೆಂಟ್</button>
    </div>

    <!-- SEARCH BAR -->
    <input type="text" id="masterSearch" class="search-input" placeholder="🔍 ಹೆಸರು ಅಥವಾ ಐಡಿ ಬಳಸಿ ಹುಡುಕಿ..." oninput="filterMasterData()">

    <!-- TAB 1: SHOP OWNERS -->
    <div id="shopsTab">
      <h3 style="font-size:0.9rem; margin-bottom:8px; color:var(--secondary);">🏪 ಲಾಗಿನ್ ಆಗಿರುವ ಅಂಗಡಿ ಮಾಲೀಕರು</h3>
      <div id="shopsListContainer"></div>
    </div>

    <!-- TAB 2: DELIVERY BOYS -->
    <div id="deliveryTab" style="display:none;">
      <h3 style="font-size:0.9rem; margin-bottom:8px; color:var(--secondary);">🛵 ಡೆಲಿವರಿ ಬಾಯ್ಸ್ ಪಟ್ಟಿ</h3>
      <div id="deliveryListContainer"></div>
    </div>

    <!-- TAB 3: CUSTOMERS -->
    <div id="customersTab" style="display:none;">
      <h3 style="font-size:0.9rem; margin-bottom:8px; color:var(--secondary);">🛍️ ಗ್ರಾಹಕರ ಪಟ್ಟಿ</h3>
      <div id="customersListContainer"></div>
    </div>

    <!-- TAB 4: RETURNS & URGENT ORDERS -->
    <div id="returnsTab" style="display:none;">
      <h3 style="font-size:0.9rem; margin-bottom:8px; color:var(--secondary);">🔄 ರಿಟರ್ನ್ ಮತ್ತು ಪಿಕ್ ಅಪ್ ಆದ ಆರ್ಡರ್‌ಗಳು</h3>
      <div id="returnsListContainer"></div>
    </div>
  </div>

  <script>
    let allShops = [];
    let allDeliveryBoys = [];
    let allCustomers = [];
    let allOrders = [];

    window.addEventListener('DOMContentLoaded', () => {
      // Handle Mobile Back Button history state so app doesn't close unexpectedly
      window.history.pushState({ page: 'master' }, '', '');
      window.addEventListener('popstate', (event) => {
        // Prevent accidental exit by maintaining state
        window.history.pushState({ page: 'master' }, '', '');
      });
    });

    function verifyMasterCode() {
      const code = document.getElementById('masterCodeInput').value.trim();
      if (code === "9353444070") {
        document.getElementById('authOverlay').style.display = 'none';
        loadMasterData();
      } else {
        alert("ತಪ್ಪು ಕೋಡ್! ದಯವಿಟ್ಟು ಸರಿಯಾದ ಕೋಡ್ ನಮೂದಿಸಿ.");
      }
    }

    function switchTab(tabId, btn) {
      document.getElementById('shopsTab').style.display = tabId === 'shopsTab' ? 'block' : 'none';
      document.getElementById('deliveryTab').style.display = tabId === 'deliveryTab' ? 'block' : 'none';
      document.getElementById('customersTab').style.display = tabId === 'customersTab' ? 'block' : 'none';
      document.getElementById('returnsTab').style.display = tabId === 'returnsTab' ? 'block' : 'none';

      document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function loadMasterData() {
      // Fetch Orders
      window.onSnapshot(window.collection(window.db, "orders"), (snap) => {
        allOrders = [];
        snap.forEach(d => allOrders.push({ id: d.id, ...d.data() }));
        processDataViews();
      });

      // Fetch Shop Owners
      window.onSnapshot(window.collection(window.db, "shop_owners"), (snap) => {
        allShops = [];
        snap.forEach(d => allShops.push({ docId: d.id, ...d.data() }));
        renderShops(allShops);
      });

      // Fetch Delivery Boys
      window.onSnapshot(window.collection(window.db, "delivery_boys"), (snap) => {
        allDeliveryBoys = [];
        snap.forEach(d => allDeliveryBoys.push({ docId: d.id, ...d.data() }));
        renderDeliveryBoys(allDeliveryBoys);
      });

      processCustomers();
    }

    function processCustomers() {
      window.onSnapshot(window.collection(window.db, "orders"), (snap) => {
        let custMap = {};
        snap.forEach(d => {
          let o = d.data();
          if (o.customer && o.customer.phone) {
            let phone = o.customer.phone;
            if (!custMap[phone]) {
              custMap[phone] = { docId: d.id, name: o.customer.name, phone: phone, village: o.customer.village, ordersCount: 0, returnsCount: 0 };
            }
            custMap[phone].ordersCount++;
            if (o.status === 'RETURNED' || o.isReturned) custMap[phone].returnsCount++;
          }
        });
        allCustomers = Object.values(custMap);
        renderCustomers(allCustomers);
      });
    }

    function processDataViews() {
      renderShops(allShops);
      renderDeliveryBoys(allDeliveryBoys);
      renderReturnsTab(allOrders);
    }

    function renderShops(list) {
      const container = document.getElementById('shopsListContainer');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#777; text-align:center; padding:10px;">ಯಾವುದೇ ಅಂಗಡಿ ಮಾಲೀಕರಿಲ್ಲ.</p>';
        return;
      }

      container.innerHTML = list.map(s => {
        let shopOrders = allOrders.filter(o => o.shopId === s.id);
        let totalOrdersCount = shopOrders.length;
        let returnsCount = shopOrders.filter(o => o.status === 'RETURNED' || o.isReturned).length;
        
        // Total money calculations with 15% commission deduction and minus returned amount
        let grossEarnings = shopOrders.reduce((acc, curr) => (curr.status === 'DELIVERED' || curr.status === 'STEP_4') ? acc + Number(curr.totalPrice || 0) : acc, 0);
        let returnDeduction = shopOrders.reduce((acc, curr) => (curr.status === 'RETURNED' || curr.isReturned) ? acc + Number(curr.totalPrice || 0) : acc, 0);
        
        let netAfterReturn = grossEarnings - returnDeduction;
        let commission15 = Math.round(netAfterReturn * 0.15);
        let payableToShop = netAfterReturn - commission15;
        if (payableToShop < 0) payableToShop = 0;

        let shopPaymentStatus = s.paymentStatus || 'PENDING'; // PENDING or SUCCESS

        return `
          <div class="card-box">
            <div style="display:flex; gap:10px; align-items:center; margin-bottom:6px;">
              <img src="${s.photo || 'https://via.placeholder.com/60'}" style="width:50px; height:50px; object-fit:cover; border-radius:50%; border:1px solid #ccc;">
              <div>
                <b>${s.shopName}</b> (${s.shopType || 'General'})<br>
                ಮಾಲೀಕರು: ${s.name} | ಫೋನ್: ${s.phone}<br>
                <b>ID: ${s.id}</b> | ಸ್ಥಳ: ${s.taluk}, ${s.district}
              </div>
            </div>
            <div style="background:#e8f4fd; padding:8px; border-radius:6px; margin:6px 0; font-size:0.78rem; line-height:1.4;">
              📊 <b>ಮಾಸಿಕ ಲೆಕ್ಕಾಚಾರ:</b><br>
              • ಒಟ್ಟು ಆರ್ಡರ್‌ಗಳು: ${totalOrdersCount} | ರಿಟರ್ನ್ ಆದವು: ${returnsCount}<br>
              • ಇವತ್ತಿನ/ಒಟ್ಟು ಹಣ: ₹${grossEarnings} (ರಿಟರ್ನ್ ಕಡಿತ: -₹${returnDeduction})<br>
              • 15% ಕಮಿಷನ್: ₹${commission15}<br>
              • <b>ಅಂಗಡಿ ಮಾಲೀಕರಿಗೆ ನೀಡಬೇಕಾದ ಮೊತ್ತ: ₹${payableToShop}</b>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <span style="font-size:0.75rem; font-weight:bold; color:${shopPaymentStatus === 'SUCCESS' ? 'var(--success)' : '#d32f2f'};">
                ${shopPaymentStatus === 'SUCCESS' ? '✅ ಪೇಮೆಂಟ್ ಸಕ್ಸಸ್‌ಫುಲ್ ಆಗಿದೆ' : '⚠️ ಪೇಮೆಂಟ್ ಪೆಂಡಿಂಗ್‌ನಲ್ಲಿದೆ (2-3 ದಿನಗಳು)'}
              </span>
              ${shopPaymentStatus !== 'SUCCESS' ? `
                <button class="btn btn-success" onclick="markShopPaymentSuccess('${s.docId}')">ಪೇಮೆಂಟ್ ಸಕ್ಸಸ್ ಮಾಡಿ</button>
              ` : ''}
              <button class="btn btn-danger" onclick="deleteRecord('shop_owners', '${s.docId}', 'ಅಂಗಡಿ ಮಾಲೀಕ')">ಡಿಲೀಟ್</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderDeliveryBoys(list) {
      const container = document.getElementById('deliveryListContainer');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#777; text-align:center; padding:10px;">ಯಾವುದೇ ಡೆಲಿವರಿ ಬಾಯ್ಸ್ ಇಲ್ಲ.</p>';
        return;
      }

      container.innerHTML = list.map(db => {
        let dbOrders = allOrders; 
        let deliveredCount = dbOrders.filter(o => o.status === 'DELIVERED' || o.status === 'STEP_4').length;
        let returnedCount = dbOrders.filter(o => o.status === 'RETURNED' || o.isReturned).length;
        let totalRevenue = dbOrders.reduce((acc, curr) => (curr.status === 'DELIVERED' || curr.status === 'STEP_4') ? acc + Number(curr.totalPrice || 0) : acc, 0);
        let commission5 = Math.round(totalRevenue * 0.05);

        return `
          <div class="card-box">
            <div style="display:flex; gap:10px; align-items:center; margin-bottom:6px;">
              <img src="${db.selfie || 'https://via.placeholder.com/60'}" style="width:50px; height:50px; object-fit:cover; border-radius:50%; border:1px solid #ccc; cursor:pointer;" onclick="openImageModal('${db.selfie}', 'ಸೆಲ್ಫಿ ಫೋಟೋ')" title="ದೊಡ್ಡದಾಗಿ ನೋಡಿ">
              <div>
                <b>${db.name}</b> (ತಂದೆ: ${db.fatherName})<br>
                ಫೋನ್: ${db.phone} | <b>ID: ${db.id}</b><br>
                ಊರು: ${db.village}, ${db.taluk}
              </div>
            </div>
            <div style="display:flex; gap:6px; margin:6px 0;">
              <button class="btn btn-primary" style="font-size:0.65rem;" onclick="openImageModal('${db.aadhaarFront}', 'ಆಧಾರ್ ಫ್ರಂಟ್')">ಆಧಾರ್ ಫ್ರಂಟ್</button>
              <button class="btn btn-primary" style="font-size:0.65rem;" onclick="openImageModal('${db.aadhaarBack}', 'ಆಧಾರ್ ಬ್ಯಾಕ್')">ಆಧಾರ್ ಬ್ಯಾಕ್</button>
              <button class="btn btn-primary" style="font-size:0.65rem;" onclick="openImageModal('${db.selfie}', 'ಸೆಲ್ಫಿ ಫೋಟೋ')">ಸೆಲ್ಫಿ</button>
            </div>
            <div style="background:#f1f8e9; padding:6px; border-radius:4px; font-size:0.75rem;">
              📦 <b>ತಿಂಗಳ ವಿಶ್ಲೇಷಣೆ:</b> ಡೆಲಿವರಿ ಕೊಟ್ಟಿದ್ದು: ${deliveredCount} | ರಿಟರ್ನ್ ಪಡೆದಿದ್ದು: ${returnedCount} | <b>5% ಕಮಿಷನ್: ₹${commission5}</b>
            </div>
            <div style="text-align:right; margin-top:6px;">
              <button class="btn btn-danger" onclick="deleteRecord('delivery_boys', '${db.docId}', 'ಡೆಲಿವರಿ ಬಾಯ್')">ಡಿಲೀಟ್ ಮಾಡಿ</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCustomers(list) {
      const container = document.getElementById('customersListContainer');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#777; text-align:center; padding:10px;">ಯಾವುದೇ ಗ್ರಾಹಕರಿಲ್ಲ.</p>';
        return;
      }

      container.innerHTML = list.map(c => `
        <div class="card-box">
          <b>ಗ್ರಾಹಕರು:</b> ${c.name} (${c.phone})<br>
          ಊರು: ${c.village}<br>
          <b>ಖರೀದಿ ಮಾಡಿರುವ ಆರ್ಡರ್ಸ್:</b> ${c.ordersCount} | <b>ರಿಟರ್ನ್ ಕಳಿಸಿರುವುದು:</b> ${c.returnsCount}
          <div style="text-align:right; margin-top:6px;">
            <button class="btn btn-danger" onclick="deleteCustomerRecord('${c.phone}')">ಗ್ರಾಹಕರನ್ನು ಬ್ಲಾಕ್ / ಡಿಲೀಟ್ ಮಾಡಿ</button>
          </div>
        </div>
      `).join('');
    }

    function renderReturnsTab(orders) {
      const container = document.getElementById('returnsListContainer');
      // Filter orders that are requested for return or picked up by delivery boy
      let returnOrders = orders.filter(o => o.isReturned || o.status === 'RETURNED' || o.returnStatus === 'RETURN_REQUESTED' || o.returnStatus === 'PICKED_UP_BY_DBOY');

      if (returnOrders.length === 0) {
        container.innerHTML = '<p style="color:#777; text-align:center; padding:10px;">ಯಾವುದೇ ರಿಟರ್ನ್ ಅಥವಾ ಪಿಕ್-ಅಪ್ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</p>';
        return;
      }

      container.innerHTML = returnOrders.map(o => {
        let isPaymentSuccess = o.paymentStatus === 'SUCCESS';
        let upiLink = `upi://pay?pa=merchant@upi&pn=NamahShapur&am=${o.totalPrice}&cu=INR`;
        let qrCodeImg = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiLink)}`;

        return `
          <div class="card-box" style="border-left: 4px solid #d32f2f;">
            <div style="display:flex; gap:10px; align-items:center;">
              <img src="${o.productPhoto || 'https://via.placeholder.com/60'}" style="width:55px; height:55px; object-fit:cover; border-radius:6px;">
              <div>
                <b>${o.productName}</b> (₹${o.totalPrice})<br>
                ಗ್ರಾಹಕರು: ${o.customer ? o.customer.name : 'N/A'} (${o.customer ? o.customer.phone : ''})<br>
                <b>ಆರ್ಡರ್ ID:</b> ${o.orderId || o.id}
              </div>
            </div>

            <div style="margin-top:8px; background:#fff3e0; padding:8px; border-radius:6px; font-size:0.78rem;">
              <p><b>ಸ್ಥಿತಿ:</b> ಡೆಲಿವರಿ ಬಾಯ್ ಪಿಕ್-ಅಪ್ ಮಾಡಿದ್ದಾರೆ / ರಿಟರ್ನ್ ಪ್ರಕ್ರಿಯೆಯಲ್ಲಿದೆ.</p>
              
              <div style="margin-top:6px; display:flex; gap:6px; align-items:center;">
                <a href="${upiLink}" class="btn btn-primary" style="flex:1; font-size:0.7rem; padding:6px;">
                  📱 ಫೋನ್‌ಪೇ / ಗೂಗಲ್ ಪೇ ಮೂಲಕ ಪಾವತಿಸಿ
                </a>
                <button class="btn btn-success" onclick="openQRModal('${qrCodeImg}', '${o.totalPrice}')" style="font-size:0.7rem; padding:6px;">
                  ಕ್ಯಾನ್ ಸ್ಕ್ಯಾನ್ ನೋಡಿ
                </button>
              </div>
            </div>

            <div style="margin-top:8px; display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:0.75rem; font-weight:bold; color:${isPaymentSuccess ? 'var(--success)' : '#d32f2f'};">
                ${isPaymentSuccess ? '✅ ಪಾವತಿ ಸಕ್ಸಸ್‌ಫುಲ್ ಆಗಿದೆ (ಗ್ರಾಹಕರಿಗೆ ತೋರಿಸಲಾಗಿದೆ)' : '⏳ ಪಾವತಿ ಪೆಂಡಿಂಗ್‌ನಲ್ಲಿದೆ'}
              </span>
              ${!isPaymentSuccess ? `
                <button class="btn btn-success" onclick="markPaymentSuccess('${o.id}')">ಪೇಮೆಂಟ್ ಸಕ್ಸಸ್ ಮಾಡಿ</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function markPaymentSuccess(orderId) {
      try {
        await window.updateDoc(window.doc(window.db, "orders", orderId), {
          paymentStatus: 'SUCCESS'
        });
        alert("ಪಾವತಿ ಯಶಸ್ವಿಯಾಗಿ ಸಕ್ಸಸ್ ಮಾಡಲಾಗಿದೆ! ಗ್ರಾಹಕರ ಆಪ್‌ನಲ್ಲಿ ಇದು ಅಪ್‌ಡೇಟ್ ಆಗುತ್ತದೆ.");
      } catch(e) {
        alert("Error: " + e.message);
      }
    }

    async function markShopPaymentSuccess(docId) {
      try {
        await window.updateDoc(window.doc(window.db, "shop_owners", docId), {
          paymentStatus: 'SUCCESS'
        });
        alert("ಅಂಗಡಿ ಮಾಲೀಕರ ಪಾವತಿ ಯಶಸ್ವಿಯಾಗಿ ಸಕ್ಸಸ್ ಮಾಡಲಾಗಿದೆ!");
      } catch(e) {
        alert("Error: " + e.message);
      }
    }

    async function deleteRecord(collectionName, docId, roleName) {
      if (confirm(`⚠️ ಎಚ್ಚರಿಕೆ: ಈ ${roleName} ಅನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಡಿಲೀಟ್ ಮಾಡಲು ಬಯಸುವಿರಾ?\n\nOK ಒತ್ತಿದರೆ ಇವರ ಐಡಿ ಮತ್ತು ಲಾಗಿನ್ ರದ್ದಾಗುತ್ತದೆ.`)) {
        try {
          await window.deleteDoc(window.doc(window.db, collectionName, docId));
          alert(`${roleName} ಯಶಸ್ವಿಯಾಗಿ ಡಿಲೀಟ್ ಮಾಡಲಾಗಿದೆ.`);
        } catch(e) {
          alert("Error: " + e.message);
        }
      }
    }

    async function deleteCustomerRecord(phone) {
      if (confirm(`⚠️ ಎಚ್ಚರಿಕೆ: ಈ ಗ್ರಾಹಕರನ್ನು (Phone: ${phone}) ಬ್ಲಾಕ್ ಮಾಡಲು ಬಯಸುವಿರಾ?`)) {
        alert("ಗ್ರಾಹಕರ ಆರ್ಡರ್‌ಗಳನ್ನು ನಿರ್ಬಂಧಿಸಲಾಗಿದೆ.");
      }
    }

    function openImageModal(imgSrc, title) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBodyContent').innerHTML = `<img src="${imgSrc}" style="width:100%; max-height:250px; object-fit:contain; margin:10px 0; border-radius:6px;">`;
      document.getElementById('downloadLink').href = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function openQRModal(qrImgSrc, price) {
      document.getElementById('modalTitle').innerText = `ಪಾವತಿ ಕ್ಯೂಆರ್ ಕೋಡ್ (₹${price})`;
      document.getElementById('modalBodyContent').innerHTML = `
        <p style="font-size:0.8rem; margin-bottom:6px;">ಫೋನ್‌ಪೇ ಅಥವಾ ಗೂಗಲ್ ಪೇ ಮೂಲಕ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ ಪಾವತಿಸಿ:</p>
        <img src="${qrImgSrc}" style="width:160px; height:160px; margin:10px auto; display:block; border:1px solid #ccc; border-radius:6px;">
      `;
      document.getElementById('downloadLink').href = qrImgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function filterMasterData() {
      const q = document.getElementById('masterSearch').value.toLowerCase();
      renderShops(allShops.filter(s => s.name.toLowerCase().includes(q) || s.id.includes(q) || s.shopName.toLowerCase().includes(q)));
      renderDeliveryBoys(allDeliveryBoys.filter(db => db.name.toLowerCase().includes(q) || db.id.includes(q)));
      renderCustomers(allCustomers.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q)));
    }
  </script>
</body>
</html>
